# Conda environment used to develop and test the app (Linux, November 2026).
#   micromamba create -f environment.yml   (or: conda env create -f environment.yml)
#   micromamba activate xenium-viewer
# Full session details: docs/sessionInfo.txt
name: xenium-viewer
channels:
  - conda-forge
  - bioconda
dependencies:
  - r-base=4.4.3
  - r-seurat=5.5.1
  - r-seuratobject=5.4.0
  - r-shiny=1.14.0
  - r-dt=0.34.0
  - r-ggplot2=4.0.3
  - r-arrow=25.0.1        # read Xenium .parquet files (demo data script)
  - r-hdf5r=1.3.16        # read cell_feature_matrix.h5 (demo data script)
  - bioconductor-glmgampoi=1.18.0  # faster SCTransform
  # Testing and screenshots (tests/, scripts/make_screenshots.R);
  # shinytest2 itself is installed from CRAN (not on conda-forge):
  #   Rscript -e 'install.packages("shinytest2", repos = "https://cloud.r-project.org")'
  - r-testthat=3.3.2
  - r-withr=3.0.3
  - r-chromote=0.5.1
  - r-websocket=1.4.4
  - r-processx=3.9.0
  - r-callr=3.7.6
  - r-httr2=1.3.0
  - r-checkmate
