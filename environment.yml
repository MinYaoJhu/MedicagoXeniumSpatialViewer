# Conda environment used to develop and test the app (Linux, November 2026).
#   micromamba create -f environment.yml   (or: conda env create -f environment.yml)
#   micromamba activate xenium-viewer
# Full session details: docs/sessionInfo.txt
name: xenium-viewer
channels:
  - conda-forge
  - bioconda
dependencies:
  - r-base=4.4.3
  - r-seurat=5.5.1
  - r-seuratobject=5.4.0
  - r-shiny=1.14.0
  - r-dt=0.34.0
  - r-ggplot2=4.0.3
  - r-arrow=25.0.1        # read Xenium .parquet files (demo data script)
  - r-hdf5r=1.3.16        # read cell_feature_matrix.h5 (demo data script)
  - bioconductor-glmgampoi=1.18.0  # faster SCTransform
  # Optional, only for scripts/make_screenshots.R:
  - r-chromote
  - r-testthat
